name: Auto Update Sitemap
on:
  push:
    branches: [main]
    paths:
      - '**.html'

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate sitemap.xml
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml
          echo '  <url><loc>https://makmalstem.com/</loc></url>' >> sitemap.xml
          find . -name "*.html" ! -name "index.html" ! -name "admin.html" | sed 's|^\./||' | sort | while read file; do
            echo "  <url><loc>https://makmalstem.com/${file}</loc></url>" >> sitemap.xml
          done
          echo '</urlset>' >> sitemap.xml
      - name: Commit sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update sitemap.xml" && git push)
